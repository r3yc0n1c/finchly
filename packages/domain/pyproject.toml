[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finchly-domain"
version = "0.1.0"
description = "Finchly domain package - canonical schemas, lifecycle, and validation interfaces"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "rfc8785>=0.1.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finchly_domain"]
