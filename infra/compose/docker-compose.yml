services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    container_name: finchly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finchly
      POSTGRES_PASSWORD: finchly_dev
      POSTGRES_DB: finchly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finchly -d finchly"]
      interval: 3s
      timeout: 3s
      retries: 5

  nats:
    image: docker.io/library/nats:2.15-alpine
    container_name: finchly-nats
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8222/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: finchly-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: finchly
      MINIO_ROOT_PASSWORD: finchly_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: finchly-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://finchly:finchly_dev@postgres:5432/finchly
      NATS_URL: nats://nats:4222
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: finchly
      S3_SECRET_ACCESS_KEY: finchly_dev_secret
      S3_BUCKET_NAME: finchly-documents
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_started

  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: finchly-prometheus
    profiles:
      - observability
    ports:
      - "9090:9090"

  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: finchly-grafana
    profiles:
      - observability
    ports:
      - "3001:3000"

volumes:
  postgres_data:
  minio_data:
