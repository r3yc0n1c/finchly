[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finchly-api"
version = "0.1.0"
description = "Finchly FastAPI control plane"
requires-python = ">=3.12"
dependencies = [
    "finchly-domain",
    "finchly-contracts",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "asyncpg>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "greenlet>=3.0.0",
    "argon2-cffi>=23.1.0",
    "nats-py>=2.9.0",
    "httpx>=0.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finchly_api"]
