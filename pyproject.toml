[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finchly"
version = "0.1.0"
description = "Finchly monorepo"
requires-python = ">=3.12"
dependencies = [
    "finchly-domain",
    "finchly-contracts",
    "finchly-api",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "asyncpg>=0.30.0",
    "nats-py>=2.9.0",
    "httpx>=0.28.0",
    "hypothesis>=6.128.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    "import-linter>=2.2",
    "detect-secrets>=1.5.0",
    "jsonschema>=4.23.0",
    "pre-commit>=4.0.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/api"]

[tool.uv.sources]
finchly-domain = { workspace = true }
finchly-contracts = { workspace = true }
finchly-api = { workspace = true }

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["packages", "apps", "tests"]
pythonpath = [
    ".",
    "packages/domain/src",
    "packages/contracts/src",
    "apps/api/src",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["finchly_domain", "finchly_contracts", "finchly_api"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
mypy_path = "packages/domain/src:packages/contracts/src:apps/api/src"

[[tool.mypy.overrides]]
module = [
    "nats.*",
    "asyncpg.*",
]
ignore_missing_imports = true
